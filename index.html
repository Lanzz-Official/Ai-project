<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100c">
<meta name="description" content="Razki.Ai — asisten virtual Villa Razki View Sawarna">
<title>Razki.Ai — Asisten Villa Razki View Sawarna</title>
<style>
:root{
  --bg:#0c0906;
  --bg2:#14100c;
  --panel:rgba(20,16,12,.85);
  --panel-2:#1a1510;
  --line:rgba(201,162,39,.18);
  --line-2:rgba(201,162,39,.32);
  --text:#faf7f1;
  --muted:#8a8278;
  --gold:#c9a227;
  --gold-2:#b8912a;
  --gold-soft:#e3cd8a;
  --cream:#faf7f1;
  --danger:#ff5b78;
  --shadow:0 20px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  background:
    radial-gradient(circle at 20% 8%, rgba(201,162,39,.10), transparent 32%),
    radial-gradient(circle at 85% 90%, rgba(201,162,39,.06), transparent 40%),
    var(--bg);
  color:var(--text);
  font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}
textarea{font:inherit;color:inherit}
::selection{background:var(--gold);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(201,162,39,.2);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:rgba(201,162,39,.4)}

/* ========= FLOATING BUTTONS (kiri atas = Home, kanan atas = Hapus) ========= */
.float-btn{
  position:fixed;
  top:calc(14px + env(safe-area-inset-top));
  z-index:50;
  width:40px;height:40px;
  border-radius:12px;
  background:rgba(20,16,12,.7);
  border:1px solid var(--line);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  display:grid;place-items:center;
  color:var(--gold-soft);
  transition:all .25s cubic-bezier(.16,.84,.44,1);
  opacity:0;visibility:hidden;
  transform:translateY(-6px);
}
.float-btn.show{opacity:1;visibility:visible;transform:none}
.float-btn:hover{
  background:var(--gold);
  border-color:var(--gold);
  color:#fff;
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(201,162,39,.35);
}
.float-btn svg{width:18px;height:18px}

.home-btn{left:16px}
.clear-btn{right:16px}
.clear-btn:hover{
  background:var(--danger);
  border-color:var(--danger);
  box-shadow:0 10px 24px rgba(255,91,120,.35);
}

/* ========= CHAT SHELL ========= */
.chat-shell{height:100dvh;width:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}

.content{
  flex:1;min-height:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:60px clamp(16px,5vw,80px) 20px;
  scroll-behavior:smooth;
}

/* ========= HERO ========= */
.hero{
  max-width:720px;margin:clamp(30px,7vh,80px) auto 0;
  text-align:center;
  animation:heroIn .7s cubic-bezier(.2,.8,.2,1) both;
}
.hero-logo{
  width:78px;height:78px;margin:0 auto 24px;
  border-radius:26px;
  background:linear-gradient(135deg,var(--gold),var(--gold-2));
  display:grid;place-items:center;
  box-shadow:0 0 40px rgba(201,162,39,.35), inset 0 1px rgba(255,255,255,.35);
  position:relative;
  animation:float 4.5s ease-in-out infinite;
}
.hero-logo::before{
  content:"";position:absolute;inset:-14px;border-radius:34px;
  border:1px solid rgba(201,162,39,.22);
  animation:ring 8s linear infinite;
}
.hero-logo svg{width:42px;height:42px;filter:drop-shadow(0 0 8px rgba(255,255,255,.4))}
.hero h1{
  font-size:clamp(38px,7vw,58px);
  font-weight:800;
  letter-spacing:-2px;
  margin:0 0 18px;
  line-height:1.05;
  background:linear-gradient(100deg,#fff 15%,#e3cd8a 50%,#c9a227 90%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  background-size:200% auto;
  animation:shimmer 6s linear infinite;
}
.hero p{
  font-size:clamp(13.5px,1.7vw,15.5px);
  color:var(--muted);
  line-height:1.75;
  max-width:560px;margin:0 auto;
  font-weight:400;
}
.hero p b{color:var(--gold-soft);font-weight:600}

/* ========= MESSAGES ========= */
.messages{max-width:820px;margin:24px auto 0}
.msg{
  display:flex;gap:12px;margin:18px 0;
  animation:msgIn .3s cubic-bezier(.2,.8,.2,1) both;
  align-items:flex-start;
}
.msg.user{flex-direction:row-reverse}
.avatar{
  width:34px;height:34px;flex:none;border-radius:11px;
  border:1px solid var(--line);
  background:var(--panel-2);
  display:grid;place-items:center;
  font-size:9px;font-weight:900;color:var(--gold-soft);
  letter-spacing:.05em;
}
.msg.user .avatar{
  background:linear-gradient(135deg,var(--gold),var(--gold-2));
  color:#fff;border-color:transparent;
}
.msg-body{min-width:0;max-width:min(82%,640px);display:flex;flex-direction:column;gap:6px}
.msg.user .msg-body{align-items:flex-end}
.bubble{
  padding:13px 17px;border-radius:18px;
  white-space:pre-wrap;overflow-wrap:anywhere;
  line-height:1.7;font-size:14px;
}
.msg.ai .bubble{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-bottom-left-radius:6px;
  color:var(--text);
}
.msg.user .bubble{
  background:linear-gradient(135deg,var(--gold),var(--gold-2));
  color:#fff;
  border-bottom-right-radius:6px;
  box-shadow:0 8px 24px rgba(201,162,39,.22);
}
.msg-time{font-size:10px;color:var(--muted);padding:0 6px;letter-spacing:.03em}

.typing{display:flex;gap:5px;padding:4px 0}
.typing i{
  width:7px;height:7px;border-radius:50%;
  background:var(--gold-soft);opacity:.6;
  animation:dot 1.2s ease-in-out infinite;
}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}

/* ========= COMPOSER ========= */
.composer{
  flex:0 0 auto;
  padding:12px clamp(16px,5vw,80px) max(16px,env(safe-area-inset-bottom));
  background:linear-gradient(transparent, var(--bg) 30%);
  position:relative;z-index:5;
}
.compose{
  max-width:820px;margin:0 auto;
  border:1px solid var(--line-2);
  background:rgba(20,16,12,.92);
  border-radius:20px;
  padding:8px;
  display:flex;align-items:flex-end;gap:8px;
  box-shadow:var(--shadow);
  transition:border-color .22s, box-shadow .22s;
}
.compose:focus-within{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(201,162,39,.12), var(--shadow);
}
.compose textarea{
  flex:1;border:0;outline:0;background:transparent;
  color:var(--text);padding:11px 13px;
  min-height:44px;max-height:160px;resize:none;
  line-height:1.5;font-size:14px;
}
.compose textarea::placeholder{color:var(--muted)}
.send-btn{
  flex:none;width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,var(--gold),var(--gold-2));
  color:#fff;display:grid;place-items:center;
  transition:all .25s cubic-bezier(.16,.84,.44,1);
  box-shadow:0 6px 18px rgba(201,162,39,.28);
}
.send-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 26px rgba(201,162,39,.42)}
.send-btn:active:not(:disabled){transform:scale(.95)}
.send-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.send-btn svg{width:19px;height:19px}
.send-btn.stop{background:linear-gradient(135deg,#ff5b78,#ff7a4f);box-shadow:0 6px 18px rgba(255,91,120,.32)}

.hint{
  max-width:820px;margin:8px auto 0;
  text-align:center;font-size:10.5px;
  color:var(--muted);letter-spacing:.03em;
  opacity:.7;
}

/* ========= ANIMATIONS ========= */
@keyframes heroIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-7px)}}
@keyframes ring{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:200% center}}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-4px);opacity:1}}

/* ========= RESPONSIVE ========= */
@media(max-width:760px){
  .content{padding:56px 14px 16px}
  .hero{margin-top:24px}
  .hero-logo{width:66px;height:66px;border-radius:22px;margin-bottom:20px}
  .hero-logo svg{width:34px;height:34px}
  .hero h1{font-size:38px;letter-spacing:-1.5px}
  .hero p{font-size:13px;line-height:1.7}
  .msg-body{max-width:88%}
  .bubble{font-size:13.5px;padding:11px 14px}
  .avatar{width:30px;height:30px;font-size:8px}
  .float-btn{top:calc(10px + env(safe-area-inset-top));width:38px;height:38px}
  .home-btn{left:12px}
  .clear-btn{right:12px}
  .compose{border-radius:16px;padding:6px}
  .compose textarea{padding:10px 11px;font-size:13.5px;min-height:42px}
  .send-btn{width:42px;height:42px;border-radius:12px}
  .send-btn svg{width:17px;height:17px}
}
@media(max-width:400px){
  .hero h1{font-size:34px}
  .hero p{font-size:12.5px}
}
</style>
</head>
<body>

<button class="float-btn home-btn" id="homeBtn" aria-label="Kembali ke halaman awal" title="Halaman awal">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 10.8 12 3.8l8.5 7"/>
    <path d="M5.5 9.8V20h13V9.8"/>
    <path d="M9.5 20v-5.2h5V20"/>
  </svg>
</button>

<button class="float-btn clear-btn" id="clearBtn" aria-label="Hapus percakapan" title="Hapus percakapan">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6h18"/>
    <path d="M8 6V4h8v2"/>
    <path d="M19 6l-1 14H6L5 6"/>
    <path d="M10 11v5M14 11v5"/>
  </svg>
</button>

<main class="chat-shell">
  <div class="content" id="content">
    <div class="hero" id="hero">
      <div class="hero-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.7l2.3 6.9L21.2 12l-6.9 2.3L12 21.3l-2.3-7L2.8 12l6.9-2.3z"/>
          <path d="M19 3v4M21 5h-4"/>
        </svg>
      </div>
      <h1>Razki.Ai</h1>
      <p>Halo Kak! Saya <b>Razki.Ai</b>, asisten virtual <b>Villa Razki View Sawarna</b>.<br>Ada yang bisa saya bantu hari ini? 🏝️</p>
    </div>
    <div class="messages" id="messages"></div>
  </div>

  <footer class="composer">
    <div class="compose">
      <textarea id="input" rows="1" placeholder="Ketik pesan untuk Razki.Ai..." autocomplete="off"></textarea>
      <button class="send-btn" id="send" aria-label="Kirim" title="Kirim">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12l16-8-6 16-3-6z"/>
        </svg>
      </button>
    </div>
    <div class="hint">Razki.Ai • Asisten Villa Razki View Sawarna</div>
  </footer>
</main>

<script>
'use strict';

const DB_NAME = 'RazkiAiDB_V1';
const STORE = 'conversations';

let current = null;
let isGenerating = false;
let activeAbort = null;

const $ = s => document.querySelector(s);
const uid = () => 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);

function formatClock(ts){
  try{
    const d = new Date(ts || Date.now());
    return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }catch(e){ return ''; }
}

/* ============ INDEXEDDB ============ */
function db(){
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function getAll(){
  const d = await db();
  return new Promise((resolve, reject) => {
    const q = d.transaction(STORE).objectStore(STORE).getAll();
    q.onsuccess = () => {
      const rows = (q.result || []).map(x => ({
        ...x,
        messages: Array.isArray(x.messages) ? x.messages : [],
        updated: x.updated || x.created || Date.now(),
        created: x.created || x.updated || Date.now()
      }));
      resolve(rows.sort((a, b) => b.updated - a.updated));
    };
    q.onerror = () => reject(q.error);
  });
}
async function saveDoc(x){
  const d = await db();
  return new Promise((resolve, reject) => {
    const q = d.transaction(STORE, 'readwrite').objectStore(STORE).put(x);
    q.onsuccess = () => resolve();
    q.onerror = () => reject(q.error);
  });
}
async function clearAll(){
  const d = await db();
  return new Promise((resolve, reject) => {
    const q = d.transaction(STORE, 'readwrite').objectStore(STORE).clear();
    q.onsuccess = () => resolve();
    q.onerror = () => reject(q.error);
  });
}

/* ============ SCROLL ============ */
function scrollDown(force){
  const c = $('#content');
  if(!c) return;
  const nearBottom = (c.scrollHeight - c.scrollTop - c.clientHeight) < 200;
  if(force || nearBottom){
    requestAnimationFrame(() => { c.scrollTop = c.scrollHeight; });
  }
}

/* ============ HERO / HOME ============ */
function showHero(){
  const h = $('#hero'); if(h) h.style.display = 'block';
  updateFloatButtons();
}
function hideHero(){
  const h = $('#hero'); if(h) h.style.display = 'none';
  updateFloatButtons();
}
function updateFloatButtons(){
  const homeBtn = $('#homeBtn');
  const clearBtn = $('#clearBtn');
  const hero = $('#hero');
  const heroVisible = hero && hero.style.display !== 'none';
  const hasMessages = $('#messages') && $('#messages').children.length > 0;

  if(homeBtn) homeBtn.classList.toggle('show', hasMessages && !heroVisible);
  if(clearBtn) clearBtn.classList.toggle('show', hasMessages);
}
function goHome(){
  const m = $('#messages');
  if(m) m.style.display = 'none';
  showHero();
  const c = $('#content');
  if(c) c.scrollTop = 0;
  const input = $('#input');
  if(input) input.focus();
}

/* ============ CLEAR CHAT ============ */
async function clearChat(){
  const hasMessages = current && current.messages && current.messages.length > 0;

  let msg = 'Hapus percakapan ini?';
  if(!hasMessages){
    msg = 'Belum ada percakapan aktif. Hapus semua data chat dari penyimpanan?';
  }

  if(!window.confirm(msg)) return;

  try{
    await clearAll();
    current = null;

    const m = $('#messages');
    if(m){
      m.innerHTML = '';
      m.style.display = 'none';
    }
    showHero();

    await newChat();

    const c = $('#content');
    if(c) c.scrollTop = 0;

    const input = $('#input');
    if(input) input.focus();
  }catch(err){
    console.error(err);
    alert('Gagal menghapus percakapan. Coba lagi.');
  }
}

/* ============ MESSAGES ============ */
function clearMessages(){
  const m = $('#messages'); if(m) m.innerHTML = '';
}

function draw(role, text, saveIt, meta){
  text = text || '';
  saveIt = saveIt !== false;
  meta = meta || {};

  const msgContainer = $('#messages');
  if(msgContainer) msgContainer.style.display = 'block';

  hideHero();

  const row = document.createElement('div');
  row.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  const msgId = meta.id || ('m_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7));
  row.dataset.msgid = msgId;
  row.dataset.raw = text;

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? 'YOU' : 'AI';

  const body = document.createElement('div');
  body.className = 'msg-body';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  body.appendChild(bubble);

  const timeEl = document.createElement('div');
  timeEl.className = 'msg-time';
  timeEl.textContent = formatClock(meta.time || Date.now());
  body.appendChild(timeEl);

  row.appendChild(av);
  row.appendChild(body);
  msgContainer.appendChild(row);

  if(saveIt && current){
    current.messages.push({
      id: msgId,
      role,
      content: text,
      time: Date.now()
    });
    current.updated = Date.now();
    saveDoc(current).catch(console.error);
  }
  scrollDown(true);
  updateFloatButtons();
  return row;
}

function renderMessages(){
  clearMessages();
  const msgContainer = $('#messages');
  if(!current || !current.messages.length){
    if(msgContainer) msgContainer.style.display = 'none';
    showHero();
    return;
  }
  if(msgContainer) msgContainer.style.display = 'block';
  hideHero();
  current.messages.forEach(x => {
    if(!x.id) x.id = 'm_' + Math.random().toString(36).slice(2, 9);
    draw(x.role, x.content, false, { id: x.id, time: x.time });
  });
  updateFloatButtons();
}

async function newChat(){
  current = {
    id: uid(),
    title: 'Chat',
    messages: [],
    created: Date.now(),
    updated: Date.now()
  };
  await saveDoc(current);
  const msgContainer = $('#messages');
  if(msgContainer) msgContainer.style.display = 'none';
  showHero();
}

/* ============ BUSY STATE ============ */
function setBusy(busy){
  isGenerating = busy;
  const btn = $('#send');
  if(!btn) return;
  btn.classList.toggle('stop', busy);
  btn.title = busy ? 'Hentikan' : 'Kirim';
  btn.setAttribute('aria-label', busy ? 'Hentikan' : 'Kirim');
  btn.innerHTML = busy
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7h10v10H7z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-3-6z"/></svg>';
}

/* ============ AI FLOW ============ */
async function runAI(text){
  if(!current) await newChat();
  if(isGenerating) return;

  isGenerating = true;
  setBusy(true);
  activeAbort = (typeof AbortController !== 'undefined') ? new AbortController() : null;

  const row = draw('ai', '', false);
  const bubble = row.querySelector('.bubble');
  const timeEl = row.querySelector('.msg-time');
  if(timeEl) timeEl.textContent = '';
  bubble.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
  row.dataset.raw = '';

  try{
    const form = new FormData();
    form.append('message', text || '');
    form.append('history', JSON.stringify(
      current.messages.slice(-20).map(m => ({ role: m.role, content: m.content }))
    ));

    const res = await fetch('/api/chat', {
      method: 'POST',
      body: form,
      signal: activeAbort ? activeAbort.signal : undefined
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(data.error || 'Server AI error');

    const reply = data.reply || 'AI tidak memberi jawaban.';
    bubble.textContent = reply;
    row.dataset.raw = reply;
    if(timeEl) timeEl.textContent = formatClock(Date.now());

    current.messages.push({
      id: row.dataset.msgid,
      role: 'ai',
      content: reply,
      time: Date.now()
    });
    current.updated = Date.now();
    await saveDoc(current);
  }catch(err){
    if(err && err.name === 'AbortError'){
      bubble.textContent = 'Dibatalkan.';
      row.dataset.raw = '';
    }else{
      console.error(err);
      bubble.textContent = 'Maaf Kak, sepertinya ada gangguan koneksi. Coba kirim ulang pesannya ya.';
      row.dataset.raw = bubble.textContent;
    }
  }finally{
    isGenerating = false;
    activeAbort = null;
    setBusy(false);
    scrollDown(true);
  }
}

async function sendMessage(){
  const input = $('#input');
  const text = (input.value || '').trim();

  if(isGenerating){
    if(activeAbort){ try{ activeAbort.abort(); }catch(e){} }
    return;
  }
  if(!text) return;
  if(!current) await newChat();

  input.value = '';
  input.style.height = 'auto';

  draw('user', text, true);
  if(current.messages.length === 1){
    current.title = text.slice(0, 44);
  }
  current.updated = Date.now();
  await saveDoc(current);

  await runAI(text);
}

/* ============ INPUT AUTO-GROW ============ */
function autoGrow(){
  const i = $('#input');
  if(!i) return;
  i.style.height = 'auto';
  i.style.height = Math.min(i.scrollHeight, 160) + 'px';
}

/* ============ EVENT BINDING ============ */
$('#send')?.addEventListener('click', e => { e.preventDefault(); sendMessage(); });

$('#input')?.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

$('#input')?.addEventListener('input', autoGrow);

$('#homeBtn')?.addEventListener('click', goHome);

$('#clearBtn')?.addEventListener('click', clearChat);

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && isGenerating && activeAbort){
    try{ activeAbort.abort(); }catch(err){}
  }
});

/* ============ INIT ============ */
(async () => {
  try{
    const rows = await getAll();
