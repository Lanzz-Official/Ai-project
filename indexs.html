<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a10"><title>LanzzAi</title>
<style>
:root{--bg:#080a10;--p:#10131c;--l:#252b3a;--t:#f4f6fb;--m:#9ca6ba;--a:#7c5cff;--b:#20d7c5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 420px at 50% -10%,#7c5cff2b,transparent 60%),var(--bg);color:var(--t);font:14px system-ui,Arial;min-height:100dvh}
.app{max-width:980px;margin:auto;min-height:100dvh}.top{position:sticky;top:0;z-index:5;padding:12px 14px;background:#080a10d9;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff0d}
.bar{display:flex;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px;flex:1}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--a),var(--b))}
.logo svg{width:24px;stroke:#fff;fill:none;stroke-width:1.8}.title{font-weight:800}.sub{font-size:11px;color:var(--m)}
button{color:var(--t);border:1px solid var(--l);background:#ffffff08;border-radius:12px;min-height:42px;padding:0 12px;cursor:pointer}.icon{width:42px;padding:0}.badge{width:18px;height:18px;display:inline-grid;place-items:center;border-radius:6px;background:linear-gradient(145deg,var(--a),var(--b));vertical-align:middle}.badge svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:1.8}
main{padding:18px 14px 130px}.hero{padding:18px;border:1px solid var(--l);border-radius:22px;background:linear-gradient(145deg,#7c5cff18,#20d7c50a)}h1{font-size:clamp(27px,7vw,44px);line-height:1.03;margin:0 0 10px}p{color:var(--m);line-height:1.55}.grad{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent}.status{font-size:12px;color:#cdd4e4}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--b);box-shadow:0 0 12px var(--b);margin-right:7px}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.quick button{text-align:left;min-height:68px}.quick span:last-child{display:block;color:var(--m);font-size:11px;margin-top:4px}
.chat{display:flex;flex-direction:column;gap:12px;margin-top:14px}.empty{text-align:center;color:var(--m);padding:28px}.msg{max-width:88%;padding:13px 14px;border:1px solid var(--l);border-radius:18px;line-height:1.55;white-space:pre-wrap;word-break:break-word}.user{margin-left:auto;background:#7c5cff25;border-bottom-right-radius:6px}.ai{background:#ffffff08;border-bottom-left-radius:6px}.meta{font-size:10px;color:var(--m);margin-bottom:6px}
.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,980px);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#080a10 28%);z-index:10}.box{display:flex;gap:8px;align-items:flex-end;padding:8px;border:1px solid var(--l);border-radius:18px;background:#10131cf2;backdrop-filter:blur(14px)}textarea{flex:1;min-height:42px;max-height:130px;resize:none;background:transparent;border:0;outline:0;color:var(--t);font:inherit;padding:9px;line-height:1.4}.send{width:44px;padding:0;background:linear-gradient(145deg,var(--a),#5d7cff);border:0}.tools{display:flex;justify-content:space-between;color:var(--m);font-size:10px;padding:5px 2px}.tools button{border:0;background:none;min-height:0;padding:3px;color:var(--m)}
@media(min-width:700px){main{padding:28px 22px 140px}.quick{grid-template-columns:repeat(4,1fr)}.msg{max-width:72%}}
@media(prefers-reduced-motion:no-preference){.hero,.msg{animation:up .25s ease both}}@keyframes up{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
</style></head><body><div class="app">
<header class="top"><div class="bar"><div class="brand"><div class="logo"><svg viewBox="0 0 24 24"><path d="M5 15.5 9.5 5l2.2 6.1L19 5l-3.8 14-3.1-6.2-2.7 6.2-2.6-3.4z"/></svg></div><div><div class="title">LanzzAi</div><div class="sub">AI assistant · HP ready</div></div></div><button class="icon" id="new">+</button><button class="icon" id="settings">⚙</button></div></header>
<main><section class="hero"><h1>Ngobrol dengan <span class="grad">LanzzAi</span></h1><p>AI chat ringan dengan riwayat lokal, prompt cepat, backup JSON, dan efek yang dibuat ramah HP.</p><div class="status"><i class="dot"></i><span id="status">Siap</span></div></section>
<section class="quick"><button data-p="Jelaskan topik ini dengan bahasa sederhana."><b><i class="badge">A</i> Jelaskan</b><span>Jawaban sederhana</span></button><button data-p="Bantu saya membuat rencana yang praktis dan realistis."><b><i class="badge">P</i> Rencanakan</b><span>Langkah terstruktur</span></button><button data-p="Bantu saya memperbaiki kode berikut:
"><b><i class="badge">C</i> Coding</b><span>Debug kode</span></button><button data-p="Ringkas informasi berikut menjadi poin penting:
"><b><i class="badge">R</i> Ringkas</b><span>Ambil inti</span></button></section>
<section class="chat" id="chat"></section></main>
<div class="composer"><div class="box"><textarea id="input" placeholder="Tulis pesan ke LanzzAi..." rows="1"></textarea><button class="send" id="send">↗</button></div><div class="tools"><span id="count">0 pesan</span><span><button id="export">Export</button> · <button id="clear">Hapus</button></span></div></div>
</div>
<script>
const $=s=>document.querySelector(s),chat=$("#chat"),input=$("#input"),send=$("#send"),status=$("#status"),count=$("#count");
let messages=JSON.parse(localStorage.getItem("lanzzai_messages")||"[]");
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem("lanzzai_messages",JSON.stringify(messages));count.textContent=messages.length+" pesan lokal"}
function render(){chat.innerHTML=messages.length?messages.map(m=>`<div class="msg ${m.role==="user"?"user":"ai"}"><div class="meta">${m.role==="user"?"Kamu":"LanzzAi"}</div>${esc(m.content)}</div>`).join(""):'<div class="empty">Belum ada percakapan. Tulis pesan untuk mulai.</div>';save();scrollTo(0,document.body.scrollHeight)}
function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,130)+"px"}
async function ask(){let text=input.value.trim();if(!text||send.disabled)return;messages.push({role:"user",content:text});input.value="";resize();messages.push({role:"assistant",content:"Menyiapkan jawaban…"});render();send.disabled=true;status.textContent="Berpikir…";let placeholder=messages[messages.length-1];try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:messages.slice(0,-1).slice(-20)})});let d=await r.json();if(!r.ok)throw Error(d.error||"Request gagal");placeholder.content=d.reply||"Tidak ada jawaban.";status.textContent="Siap"}catch(e){placeholder.content="Gagal terhubung ke AI: "+e.message;status.textContent="Periksa API"}finally{send.disabled=false;render()}}
input.oninput=resize;input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}};send.onclick=ask;
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{input.value=b.dataset.p;resize();input.focus()});
$("#new").onclick=()=>{messages=[];render()};$("#clear").onclick=()=>{if(confirm("Hapus semua chat lokal?")){messages=[];render()}};
$("#export").onclick=()=>{let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify({app:"LanzzAi",messages},null,2)],{type:"application/json"}));a.href=u;a.download="lanzzai-backup.json";a.click();URL.revokeObjectURL(u)};
$("#settings").onclick=()=>alert("LanzzAi HP Ready\nRiwayat: localStorage\nBackend: Vercel Flask\nAPI key: server-side");
render();
</script></body></html>
